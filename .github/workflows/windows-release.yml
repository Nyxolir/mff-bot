name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-main
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the pinned Python build interpreter
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: installer/requirements-build.txt
      - name: Assign a unique release version
        shell: pwsh
        run: |
          "MFF_VERSION=0.1.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_ENV
      - name: Build and test the application, installer, upgrade and uninstall
        shell: pwsh
        run: ./installer/Build.ps1 -Version $env:MFF_VERSION -Python python
      - name: Publish the verified installer as Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v' + $env:MFF_VERSION
          $assets = @('dist/release/MFF-Bot-Setup.exe','dist/release/MFF-Bot-Source.zip','dist/release/BUILD-MANIFEST.json','dist/release/SHA256SUMS.txt')
          $manifest = Get-Content -LiteralPath 'dist/release/BUILD-MANIFEST.json' -Raw | ConvertFrom-Json
          if ($manifest.source_commit -ne $env:GITHUB_SHA -or !$manifest.self_test.passed -or !$manifest.installation_test.passed) { throw 'Build source or validation does not match this run' }
          foreach ($asset in $assets) {
            if (!(Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          }
          $existing = gh release view $tag --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (!$release.isDraft) {
              $existingCommit = gh api "repos/$env:GH_REPO/git/ref/tags/$tag" --jq .object.sha
              if ($LASTEXITCODE -ne 0 -or $existingCommit -ne $env:GITHUB_SHA) { throw 'Existing release points to a different source revision' }
              Write-Output 'This verified source revision is already released'
              exit 0
            }
            if ($release.targetCommitish -ne $env:GITHUB_SHA) { throw 'Existing draft points to a different source revision' }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --draft --target $env:GITHUB_SHA --title "MFF Bot $env:MFF_VERSION" --notes-file installer/RELEASE-NOTES.md --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed; previous latest release is unchanged' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Verified draft could not be published; previous latest release is unchanged' }
