name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-main
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up the pinned Python build interpreter
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: pip
          cache-dependency-path: installer/requirements-build.txt
      - name: Assign a unique release version
        shell: pwsh
        run: |
          "MFF_VERSION=0.1.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_ENV
      - name: Build and test the application, installer, upgrade and uninstall
        shell: pwsh
        run: ./installer/Build.ps1 -Version $env:MFF_VERSION -Python python
      - name: Publish the versioned installer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'v' + $env:MFF_VERSION
          $assets = @('dist/release/MFF-Bot-Setup.exe','dist/release/MFF-Bot-Source.zip','dist/release/BUILD-MANIFEST.json','dist/release/SHA256SUMS.txt')
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $existing = gh api "repos/$env:GH_REPO/git/ref/tags/$tag" --jq .object.sha
            if ($existing -ne $env:GITHUB_SHA) { throw 'Existing release points to a different source revision' }
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target $env:GITHUB_SHA --title "MFF Bot $env:MFF_VERSION" --notes-file installer/RELEASE-NOTES.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
